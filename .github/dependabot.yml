version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Bundler PRs are proposals only: they must be reviewed by a human
  # (AGENTS.md: no new gems without explicit confirmation). Never auto-merge.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
