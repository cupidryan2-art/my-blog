name: Build, Verify and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded PR runs only; never interrupt a main-branch deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/qlog-browser" --no-package-lock playwright@1.58.2
          "$RUNNER_TEMP/qlog-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify (data, both production builds, site checks, htmlproofer, browser smoke)
        run: bash scripts/verify.sh
        env:
          VERIFY_DIR: ${{ runner.temp }}/qlog-verify
          QLOG_PLAYWRIGHT_DIR: ${{ runner.temp }}/qlog-browser
          SCREENSHOT_DIR: ${{ runner.temp }}/qlog-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: ${{ runner.temp }}/qlog-screenshots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/qlog-verify/pages
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
