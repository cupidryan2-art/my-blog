name: Check dependency lockfile
on:
  pull_request:
    paths: [Gemfile, Gemfile.lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle check
      - run: git diff --exit-code -- Gemfile.lock
